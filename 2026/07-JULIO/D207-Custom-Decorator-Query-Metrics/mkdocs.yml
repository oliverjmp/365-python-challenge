site_name: D207 - Custom Decorator Query Metrics
site_description: Decorador avanzado para medición automática de latencias en consultas SQL con DuckDB.
site_author: Oliver
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange

nav:
  - Inicio: index.md
  - Arquitectura: architecture.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences