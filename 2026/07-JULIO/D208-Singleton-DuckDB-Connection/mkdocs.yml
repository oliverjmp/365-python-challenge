site_name: D208 - Singleton DuckDB Connection
site_description: Patrón de diseño creacional para garantizar una única instancia segura de DuckDB.
site_author: Oliver
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange

nav:
  - Inicio: index.md
  - Arquitectura: architecture.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.superfences