services:
  postgres_db:
    image: postgres:15-alpine
    container_name: d173_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bi_database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bi_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  streamlit_bi:
    build: .
    container_name: d173_streamlit_bi
    ports:
      - "8501:8501"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=bi_database
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata: